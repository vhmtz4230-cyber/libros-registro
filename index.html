<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Libros con Vida — Registro</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <span class="icon">📚</span>
  <div>
    <h1>Libros con Vida</h1>
    <p>Registro de personas y artículos</p>
  </div>
  <div class="header-actions">
    <span id="admin-badge" class="admin-badge" style="display:none">Admin</span>
    <button id="btn-admin-toggle" class="btn-admin" onclick="toggleAdmin()">Admin</button>
  </div>
</header>

<div class="container">

  <div class="stats">
    <div class="stat-card">
      <div class="label">Personas ayudadas</div>
      <div class="value" id="stat-total">0</div>
      <div class="sub">registros</div>
    </div>
    <div class="stat-card">
      <div class="label">Entregaron artículos</div>
      <div class="value" id="stat-donantes">0</div>
      <div class="sub">personas</div>
    </div>
  </div>

  <div class="form-card">
    <h2 id="form-title">Registrar persona</h2>
    <div class="form-grid">
      <div class="field">
        <label for="inp-nombre">Nombre completo *</label>
        <input id="inp-nombre" type="text" placeholder="Ej. Ana García" />
      </div>
      <div class="field">
        <label for="inp-email">Correo electrónico</label>
        <input id="inp-email" type="email" placeholder="correo@ejemplo.com" />
      </div>
      <div class="field">
        <label for="inp-monto">Artículos recibidos</label>
        <input id="inp-monto" type="number" placeholder="0" min="0" step="1" />
      </div>
      <div class="field">
        <label for="inp-fecha">Fecha</label>
        <input id="inp-fecha" type="date" />
      </div>
      <div class="field full">
        <label for="inp-nota">Nota (opcional)</label>
        <textarea id="inp-nota" placeholder="Ej. trajo 3 libros, viene del colectivo..."></textarea>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-secondary" onclick="limpiar()">Limpiar</button>
      <button class="btn btn-primary" id="btn-guardar" onclick="registrar()">Registrar persona</button>
    </div>
  </div>

  <div class="table-card">
    <div class="table-header">
      <h2>Registro (<span id="count-visible">0</span>)</h2>
      <div class="search-wrap">
        <input id="search" type="text" placeholder="Buscar..." oninput="renderTabla()" />
        <button class="btn-export" onclick="exportarCSV()">Exportar CSV</button>
      </div>
    </div>
    <div id="tabla-wrap"></div>
  </div>

</div>

<!-- Modal admin -->
<div id="modal-overlay" class="modal-overlay" style="display:none" onclick="cerrarModal(event)">
  <div class="modal">
    <h3>Acceso Admin</h3>
    <p>Ingresa la contraseña para continuar</p>
    <input id="inp-pass" type="password" placeholder="Contraseña" onkeydown="if(event.key==='Enter') verificarPass()" />
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="verificarPass()">Entrar</button>
    </div>
    <p id="pass-error" class="pass-error" style="display:none">Contraseña incorrecta</p>
  </div>
</div>

<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
