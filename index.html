<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Libros con Vida — Registro de Donantes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <span class="icon">📚</span>
  <div>
    <h1>Libros con Vida</h1>
    <p>Registro de personas y donaciones</p>
  </div>
</header>

<div class="container">

  <div class="stats">
    <div class="stat-card">
      <div class="label">Personas ayudadas</div>
      <div class="value" id="stat-total">0</div>
      <div class="sub">registros</div>
    </div>
    <div class="stat-card">
      <div class="label">Total artículos</div>
      <div class="value" id="stat-monto">0</div>
      <div class="sub">libros y cuadernos</div>
    </div>
    <div class="stat-card">
      <div class="label">Entregaron artículos</div>
      <div class="value" id="stat-donantes">0</div>
      <div class="sub">personas</div>
    </div>
  </div>

  <div class="form-card">
    <h2>Registrar persona</h2>
    <div class="form-grid">
      <div class="field">
        <label for="inp-nombre">Nombre completo *</label>
        <input id="inp-nombre" type="text" placeholder="Ej. Ana García" />
      </div>
      <div class="field">
        <label for="inp-email">Correo electrónico</label>
        <input id="inp-email" type="email" placeholder="correo@ejemplo.com" />
      </div>
      <div class="field">
        <label for="inp-monto">Artículos recibidos</label>
        <input id="inp-monto" type="number" placeholder="0" min="0" step="1" />
      </div>
      <div class="field">
        <label for="inp-fecha">Fecha</label>
        <input id="inp-fecha" type="date" />
      </div>
      <div class="field full">
        <label for="inp-nota">Nota (opcional)</label>
        <textarea id="inp-nota" placeholder="Ej. donó 3 libros, viene del colectivo..."></textarea>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-secondary" onclick="limpiar()">Limpiar</button>
      <button class="btn btn-primary" onclick="registrar()">Registrar persona</button>
    </div>
  </div>

  <div class="table-card">
    <div class="table-header">
      <h2>Registro (<span id="count-visible">0</span>)</h2>
      <div class="search-wrap">
        <input id="search" type="text" placeholder="Buscar..." oninput="renderTabla()" />
        <button class="btn-export" onclick="exportarCSV()">Exportar CSV</button>
      </div>
    </div>
    <div id="tabla-wrap"></div>
  </div>

</div>

<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
